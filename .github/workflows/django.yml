name: Django CI

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/${{ github.repository }}:ci-rocky9-py312
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: psws
          MARIADB_USER: psws_user
          MARIADB_PASSWORD: psws_pass
          MARIADB_ROOT_PASSWORD: root_pass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -upsws_user -ppsws_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          python3 -m pip install -r requirements-ci.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: psws.settings.prod
          PSWS_DB_ENGINE: django.db.backends.mysql
          PSWS_DB_NAME: psws
          PSWS_DB_USER: psws_user
          PSWS_DB_PASSWORD: psws_pass
          PSWS_DB_HOST: mariadb
          PSWS_DB_PORT: "3306"
          SECRET_KEY: "unit-tests"
        run: |
          python manage.py test
