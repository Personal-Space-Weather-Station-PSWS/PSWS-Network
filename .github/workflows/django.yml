name: Django CI

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: psws
          MARIADB_USER: psws_user
          MARIADB_PASSWORD: psws_pass
          MARIADB_ROOT_PASSWORD: root_pass
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -upsws_user -ppsws_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]  

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Rocky)
        run: |
          dnf -y update
          dnf -y install git python3 python3-pip gcc python3-devel pkgconfig mariadb-connector-c-devel

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: psws.settings.prod
          PSWS_DB_ENGINE: django.db.backends.mysql
          PSWS_DB_NAME: psws
          PSWS_DB_USER: psws_user
          PSWS_DB_PASSWORD: psws_pass
          PSWS_DB_HOST: mariadb
          PSWS_DB_PORT: "3306"
          SECRET_KEY: "unit-tests"
        run: |
          python3 manage.py test
